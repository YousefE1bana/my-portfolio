    <script>
      (function () {
        try {
          var stored = localStorage.getItem("yo-theme");
          var theme =
            stored === "light" || stored === "dark" || stored === "after-hours"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
